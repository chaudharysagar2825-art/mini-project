version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: manas_setu_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: manas_setu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manas_setu"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
    container_name: manas_setu_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@db:5432/manas_setu
      JWT_SECRET_KEY: change_me_jwt_secret_in_production_min_32_characters
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      SMS_PROVIDER: mock
      IVR_PROVIDER: mock
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: deployment/frontend.Dockerfile
    container_name: manas_setu_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"

volumes:
  postgres_data:
